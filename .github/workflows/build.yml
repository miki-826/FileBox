name: FileBox 開発プレビューの作成・配布

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retire-downloader:
    name: 検出された旧ダウンローダーの配布を停止
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...context.repo, tag: 'preview'})).data;
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id: release.id});
            for (const asset of assets) {
              if (['FileBox-Setup.exe', 'FileBox-Setup.exe.sha256'].includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: asset.id});
              }
            }
            const notice = '旧 FileBox-Setup.exe は Defender の検出を受け配布停止しました。復元・許可や保護機能の無効化はしないでください。';
            if (!release.body?.startsWith(notice)) {
              await github.rest.repos.updateRelease({...context.repo, release_id: release.id,
                body: notice + '\n\n新しい配布物は公開前スキャンの完了後にこのページで案内します。'});
            }

  build:
    name: テスト・Windows 版の作成
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 単体テスト
        run: dotnet test FileBox.sln -c Release

      - name: 本体をビルド（ランタイム同梱・x64）
        run: dotnet build src/FileBox.App -c Release -p:Platform=x64 -r win-x64 -p:SelfContained=true

      - name: 本体 ZIP を作成して同梱ファイルを検証
        shell: pwsh
        run: ./scripts/Package-Preview.ps1 -SkipBuild

      - name: 本体と ZIP を Defender で検査
        shell: pwsh
        run: ./scripts/Test-ReleaseSafety.ps1 -Path 'src/FileBox.App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64', 'dist/FileBox-preview-win-x64.zip' -ReportPath dist/FileBox-app-scan.json -UpdateSignatures

      - name: 本体 ZIP を保存
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileBox-App-Windows-x64
          path: |
            dist/FileBox-preview-win-x64.zip
            dist/FileBox-preview-win-x64.zip.sha256
            dist/FileBox-app-scan.json
          if-no-files-found: error
          retention-days: 30

      - name: 検証結果と成果物への案内
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          @"
          ## Windows x64 版の作成が完了しました
          - 単体テスト・本体のビルド・ZIP の同梱検証・Defender の配布前スキャンに成功しました。
          - [この実行の成果物]($env:ARTIFACT_URL)（開発・検証向け。GitHub ログインが必要です）
          - main の配布では、次のジョブで [開発プレビューの配布ページ](https://github.com/miki-826/FileBox/releases/tag/preview) を更新します。
          "@ >> $env:GITHUB_STEP_SUMMARY

  installer:
    name: インストーラー EXE の作成
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: FileBox-App-Windows-x64
          path: dist

      - name: 本体同梱のインストーラーを作成（Inno Setup）
        shell: pwsh
        run: |
          # 検証済みの本体 ZIP を展開して、そのままインストーラーに入れる
          Expand-Archive -LiteralPath dist/FileBox-preview-win-x64.zip -DestinationPath dist/app -Force
          ./scripts/Build-Installer.ps1 -SourceDir dist/app

      - name: 最終インストーラーを Defender で検査
        shell: pwsh
        run: ./scripts/Test-ReleaseSafety.ps1 -Path dist/FileBox-Installer-preview-win-x64.exe -ReportPath dist/FileBox-installer-scan.json -UpdateSignatures

      - name: インストーラーを保存
        id: installer-artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileBox-Installer-Windows-x64
          path: |
            dist/FileBox-Installer-preview-win-x64.exe
            dist/FileBox-Installer-preview-win-x64.exe.sha256
            dist/FileBox-installer-scan.json
          if-no-files-found: error
          retention-days: 30

      - name: インストーラーへの案内
        shell: pwsh
        env:
          INSTALLER_ARTIFACT_URL: ${{ steps.installer-artifact.outputs.artifact-url }}
        run: |
          @"
          ## インストーラー EXE を作成しました
          - [この実行のインストーラー]($env:INSTALLER_ARTIFACT_URL)（GitHub ログインが必要です）
          - FileBox-Installer-preview-win-x64.exe は本体を同梱したインストーラーです（オフラインで導入でき、アンインストールにも対応）。
          - 最終 EXE の Defender スキャンに成功しました。定義バージョンと SHA-256 は同梱の JSON に記録しています。
          - main からの公開後は [インストーラーを直接ダウンロード](https://github.com/miki-826/FileBox/releases/download/preview/FileBox-Installer-preview-win-x64.exe) できます。
          "@ >> $env:GITHUB_STEP_SUMMARY

  release:
    name: ダウンロードページの更新
    needs: [build, installer, retire-downloader]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FileBox-App-Windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: FileBox-Installer-Windows-x64
          path: dist

      - name: 開発プレビューのタグとページを更新
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const repo = context.repo;
            // 固定の preview タグだけを更新する。製品版のリリースは作らない。
            try {
              await github.rest.git.updateRef({...repo, ref: 'tags/preview', sha: context.sha, force: true});
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
              await github.rest.git.createRef({...repo, ref: 'refs/tags/preview', sha: context.sha});
            }
            const body = fs.readFileSync('scripts/Release-Notes.md', 'utf8') +
              `\n\nビルド元: [${context.sha.slice(0, 7)}](https://github.com/${repo.owner}/${repo.repo}/commit/${context.sha})\n`;
            const fields = {...repo, tag_name: 'preview', name: 'FileBox 開発プレビュー（Windows x64）', body, prerelease: true, make_latest: 'false'};
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...repo, tag: 'preview'})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release) await github.rest.repos.updateRelease({...fields, release_id: release.id});
            else await github.rest.repos.createRelease(fields);

      - name: EXE・ZIP・確認用ハッシュを公開
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload preview dist/FileBox-Installer-preview-win-x64.exe dist/FileBox-Installer-preview-win-x64.exe.sha256 dist/FileBox-preview-win-x64.zip dist/FileBox-preview-win-x64.zip.sha256 dist/FileBox-app-scan.json dist/FileBox-installer-scan.json --clobber
          if ($LASTEXITCODE -ne 0) { throw '配布ファイルの公開に失敗しました。' }

      - name: ダウンロードリンクを表示
        shell: pwsh
        run: |
          Get-Content scripts/Release-Notes.md -Raw >> $env:GITHUB_STEP_SUMMARY
